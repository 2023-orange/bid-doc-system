# Goal-0: 本地开发环境配置
# 敏感值统一通过环境变量注入，避免把本机密码提交到远端仓库。

spring:
  # ===================================================================
  # 数据库配置 (PostgreSQL)
  # ===================================================================
  datasource:
    driver-class-name: org.postgresql.Driver
    # stringtype=unspecified：让 PG JDBC 不要把 String 强制声明为 varchar，使 MyBatis-Plus
    # JacksonTypeHandler 输出的 JSON 字符串能直接落入 jsonb 列（audit_operation_log
    # 的 before_data / after_data / extra_data）。属于最小侵入的兼容开关。
    url: jdbc:postgresql://localhost:5432/bid_doc_system?stringtype=unspecified
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

  # ===================================================================
  # Redis 配置
  # ===================================================================
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 100ms

  # ===================================================================
  # Flyway 配置（本地开发阶段暂时关闭）
  # ===================================================================
  flyway:
    # 当前项目仍处于开发阶段，暂不让启动流程自动执行数据库迁移；
    # 等表结构稳定、迁移版本整理完成后，再恢复 enabled=true。
    enabled: false
    # 保留迁移目录配置，后续重新启用 Flyway 时可直接复用。
    locations: classpath:db/migration
    # baseline-on-migrate: 对现存测试库（已有数据），首次启动时创建 flyway_schema_history 表
    # 并写入 baseline 记录（version=4），跳过 V1-V4 的执行；对新建空库，从 V1 一路执行
    baseline-on-migrate: true
    baseline-version: 4
    # clean-disabled: 永久禁止 flyway clean 命令
    clean-disabled: true

  # ===================================================================
  # Goal-1: 文件上传配置
  # ===================================================================
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 52MB

# ===================================================================
# Sa-Token JWT 秘钥（本地开发用，建议通过环境变量覆盖）
# ===================================================================
sa-token:
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET:dev-only-change-me}

# ===================================================================
# Goal-1: Document 模块存储配置
# ===================================================================
storage:
  type: ${STORAGE_TYPE:local}
  local:
    root: ${STORAGE_LOCAL_ROOT:./.local-storage}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-name: ${MINIO_BUCKET:bid-doc-system}
