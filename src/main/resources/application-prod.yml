# Goal-0: 生产环境配置占位
# 所有敏感配置使用环境变量占位，无明文密码

spring:
  # ===================================================================
  # 数据库配置 (PostgreSQL)
  # ===================================================================
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

  # ===================================================================
  # Redis 配置
  # ===================================================================
  data:
    redis:
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 100ms

  # ===================================================================
  # Flyway 配置
  # ===================================================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 生产环境必须从干净库开始，不允许跳过历史 migration
    baseline-on-migrate: false
    # 永久禁止 flyway clean 命令
    clean-disabled: true

# ===================================================================
# Sa-Token JWT 秘钥（生产环境必须由环境变量提供）
# ===================================================================
sa-token:
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET:}
